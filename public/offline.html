<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5A623">
<title>QatliA · Pas de connexion</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #060B14; color: #E6EAF2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  main { max-width: 360px; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 1.35rem; margin: 20px 0 8px; }
  p { margin: 0 0 4px; color: #9AA4B5; line-height: 1.5; }
  .ar { margin-top: 18px; }
  button {
    margin-top: 28px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
    background: #F5A623; color: #060B14; font: inherit; font-weight: 700; font-size: 1rem;
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <circle cx="24" cy="24" r="22" stroke="#F5A623" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="14" stroke="#F5A623" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="24" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#F5A623" font-family="system-ui, sans-serif">Q</text>
  </svg>
  <h1>Pas de connexion</h1>
  <p>Vérifiez votre connexion Internet, puis réessayez.</p>
  <div class="ar" lang="ar" dir="rtl">
    <h1>لا يوجد اتصال</h1>
    <p>تحقق من اتصالك بالإنترنت ثم أعد المحاولة.</p>
  </div>
  <button type="button" onclick="location.reload()">Réessayer · أعد المحاولة</button>
</main>
<script>
  // Back online: reload on the page the visitor asked for.
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
